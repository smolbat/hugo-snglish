baseURL: 'https://snglish.ru'
title: Snglish
languageCode: en-us
theme: tailbliss
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Битюцкий Андрей
  authorimage: assets/images/global/author.webp
  og_image: images/tailbliss-cover.png
  moto: "Мгновенное погружение в Английский"
  description: "Смотрим, слушаем, читаем и сразу же понимаем живую английскую речь."
  disable_theme_toggle: false
  disable_stay_uptodate: true

  p1:
    heading: "Наша миссия"
    image: "images/pages/our-mission.png"
    content:
      - text: "Любой иностранный язык должен быть средством общения, а не преградой. Слушая любимые рассказы, читая любимых авторов, знакомьтесь с иностранной культурой, а мы поможем убрать все преграды и сложности."
      - text: "При строительстве Вавилонской башни люди говорили на одном языке. Наш сайт поможет вернуться в то удивительное время."
      - text: "Пробуйте. Читайте. Слушайте. Самое главное - ничего не бойтесь и вы получите новую жизнь!"
  p4:
    heading: "Аудио (книги и подкасты)"
    content:
      - text: "Просто запускай любой подкаст и наслаждайся. Все получится само - быстро, просто и максимально удобно!"
  p5:
    heading: "Быть в курсе последних событий"
    content:
      - text: "Подпишитесь на нашу рассылку и вы будете первыми узнавать самые актуальные новости и изменения на нашем сайте."
    action: "#"
    label: "Email адрес"
    placeholder: "Введите ваш email"
    button: "Хочу знать новости"
    

